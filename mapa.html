  <link rel="stylesheet" href="assets/css/components/status.css">
  <link rel="stylesheet" href="assets/css/components/button.css">
  <link rel="stylesheet" href="assets/css/components/empty.css">
  <link rel="stylesheet" href="assets/css/components/modal.css">
  <link rel="stylesheet" href="assets/vendor/leaflet1.9.3/leaflet.css">
  <link rel="stylesheet" href="assets/css/components/tabbar.css">
  <link rel="stylesheet" href="assets/css/components/typography.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    /* Mapa a pantalla completa sota el chrome (capçalera en flux normal,
       mapa = tota la resta), sense dependre de l'alçada exacta de la
       capçalera (evita nombres màgics). */
    body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .voff-header-wrap { flex-shrink: 0; }
    #main-content.ds-main {
      max-width: none; padding: 0; margin: 0;
      flex: 1; min-height: 0; position: relative;
    }
    #voff-map { position: absolute; inset: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    /* Suavitza el mapa base (tile.openstreetmap.org és l'únic proveïdor
       OSM sense clau d'API que encara funciona) — menys saturat i una
       mica més clar, perquè es llegeixi millor amb els marcadors a
       sobre. Els marcadors/popus no porten aquesta classe. */
    .voff-map-tiles-soft { filter: saturate(0.55) brightness(1.12) contrast(0.92); }
    /* Marcadors amb icona de color (pin de Font Awesome) en lloc del
       xinxeta blava per defecte de Leaflet — mateix codi de color que
       .circuitBadge: blau=Visa, taronja=OFF. */
    .voff-map-marker { text-align: center; cursor: pointer; }
    .voff-map-marker i {
      font-size: 30px;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35));
    }
    .voff-map-marker--visa i { color: var(--ds-color-primary); }
    .voff-map-marker--off i { color: var(--ds-color-accent); }
    .voff-map-marker--mixed i { color: var(--ds-color-text); }
    /* A la dreta (no a l'esquerra): el control de zoom natiu de Leaflet
       viu al top-left del mapa (leaflet-top.leaflet-left, z-index propi
       molt alt) i tapava/interceptava els clics d'aquest panell quan
       coincidien al mateix racó — els filtres no s'aplicaven perquè el
       clic real l'atrapava el botó de zoom, no el botó Visa/OFF de sota. */
    .voff-map-filters {
      /* z-index molt alt a propòsit: els panes/controls interns de
         Leaflet (dins de #voff-map) fan servir z-index de fins a ~1000
         (leaflet-top/leaflet-control-container), i com que #voff-map no
         estableix un context d'apilament propi (position:absolute sense
         z-index), els seus descendents competien directament amb aquest
         panell i el tapaven sencer. */
      position: absolute; top: var(--ds-space-3); right: var(--ds-space-3); z-index: 1100;
      display: flex; flex-direction: column; gap: var(--ds-space-1);
      background: var(--ds-color-surface); padding: var(--ds-space-2);
      border-radius: var(--ds-radius); box-shadow: var(--ds-shadow);
    }
  </style>
  <script src="assets/css/router.js"></script>
  <script src="assets/css/components/modal.js"></script>
  <script src="assets/css/components/tabbar.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <a class="ds-skip-link" href="#main-content">Salta al contingut principal</a>

  <header class="voff-header-wrap">
    <div class="ds-site-header">
      <div class="ds-site-header__text">
        <p class="ds-site-header__title">Visa 2026 i VISA OFF</p>
        <p class="ds-site-header__subtitle">Mapa &middot; només emplaçaments amb coordenades verificades</p>
      </div>
      <div class="voff-header__actions">
        <button class="ds-icon-button voff-header__fontsize-btn" id="btn-fontsize" type="button" aria-label="Augmenta la mida de la lletra">
          <i class="fa-solid fa-text-height" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" class="ds-main" tabindex="-1" style="position:relative;">
    <div class="voff-map-filters" role="group" aria-label="Filtra el mapa">
      <button class="ds-button ds-button--sm" data-map-filter="tots" type="button">Tots</button>
      <button class="ds-button ds-button--sm ds-button--ghost" data-map-filter="VISA" type="button">Visa</button>
      <button class="ds-button ds-button--sm ds-button--ghost" data-map-filter="OFF" type="button">OFF</button>
    </div>
    <div id="voff-map"></div>
    <noscript><p class="ds-text" style="padding:var(--ds-space-4);">El mapa necessita JavaScript. Consulta la llista a «Explora».</p></noscript>
  </main>

  <nav class="ds-tabbar" aria-label="Navegació principal">
    <a class="ds-tabbar__item" data-tab="index" href="index.html"><i class="fa-solid fa-location-dot" aria-hidden="true"></i><span>A prop</span></a>
    <a class="ds-tabbar__item" data-tab="explora" href="explora.html"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span>Explora</span></a>
    <a class="ds-tabbar__item" data-tab="ruta" href="ruta.html"><i class="fa-solid fa-route" aria-hidden="true"></i><span>Ruta<span class="ds-tabbar__badge" id="voff-route-badge" hidden>0</span></span></a>
    <a class="ds-tabbar__item" data-tab="mapa" href="mapa.html"><i class="fa-solid fa-map" aria-hidden="true"></i><span>Mapa</span></a>
  </nav>

  <dialog class="ds-modal ds-modal--fit" id="dlg-venue" aria-labelledby="dlg-venue-title">

      <p class="ds-modal__title" id="dlg-venue-title">Exposicions</p>
      <button class="ds-icon-button" data-ds-modal-close aria-label="Tanca"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
    <div class="ds-modal__body" id="dlg-venue-body"></div>
  </dialog>

  <dialog class="ds-modal ds-modal--fit" id="dlg-fitxa" aria-labelledby="dlg-fitxa-title">
    <div class="ds-modal__header">
      <p class="ds-modal__title" id="dlg-fitxa-title">Fitxa d'exposició</p>
      <button class="ds-icon-button" data-ds-modal-close aria-label="Tanca"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
    <div class="ds-modal__body" id="dlg-fitxa-body"></div>
  </dialog>

  <script src="assets/vendor/leaflet1.9.3/leaflet.js"></script>
  <script src="js/fontsize.js"></script>
  <script src="js/mapa.js"></script>
</body>
</html>
