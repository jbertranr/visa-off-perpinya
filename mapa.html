<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mapa · Visa+OFF Perpinyà</title>
  <meta name="description" content="Mapa dels emplaçaments de les exposicions de Visa pour l'Image i l'OFF a Perpinyà.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1857c4">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/skins/skin-neutra.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components/badge.css">
  <link rel="stylesheet" href="assets/css/components/button.css">
  <link rel="stylesheet" href="assets/vendor/leaflet1.9.3/leaflet.css">
  <link rel="stylesheet" href="assets/css/components/tabbar.css">
  <link rel="stylesheet" href="assets/css/components/typography.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    /* Mapa a pantalla completa sota el chrome (capçalera en flux normal,
       mapa = tota la resta), sense dependre de l'alçada exacta de la
       capçalera (evita nombres màgics). */
    body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .voff-header-wrap { flex-shrink: 0; }
    #main-content.ds-main {
      max-width: none; padding: 0; margin: 0;
      flex: 1; min-height: 0; position: relative;
    }
    #voff-map { position: absolute; inset: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    .voff-map-filters {
      position: absolute; top: var(--ds-space-3); left: var(--ds-space-3); z-index: 20;
      display: flex; flex-direction: column; gap: var(--ds-space-1);
      background: var(--ds-color-surface); padding: var(--ds-space-2);
      border-radius: var(--ds-radius); box-shadow: var(--ds-shadow);
    }
  </style>
  <script src="assets/css/router.js"></script>
  <script src="assets/css/components/tabbar.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <a class="ds-skip-link" href="#main-content">Salta al contingut principal</a>

  <header class="voff-header-wrap">
    <div class="ds-site-header">
      <div class="ds-site-header__logo-wrap">
        <img class="ds-site-header__logo" src="assets/icons/icon.svg" alt="" aria-hidden="true">
      </div>
      <div class="ds-site-header__text">
        <p class="ds-site-header__title">Visa 2026 i VISA OFF</p>
        <p class="ds-site-header__subtitle">Mapa &middot; només emplaçaments amb coordenades verificades</p>
      </div>
    </div>
  </header>

  <main id="main-content" class="ds-main" tabindex="-1" style="position:relative;">
    <div class="voff-map-filters" role="group" aria-label="Filtra el mapa">
      <button class="ds-button ds-button--sm" data-map-filter="tots" type="button">Tots</button>
      <button class="ds-button ds-button--sm ds-button--ghost" data-map-filter="VISA" type="button">Visa</button>
      <button class="ds-button ds-button--sm ds-button--ghost" data-map-filter="OFF" type="button">OFF</button>
    </div>
    <div id="voff-map"></div>
    <noscript><p class="ds-text" style="padding:var(--ds-space-4);">El mapa necessita JavaScript. Consulta la llista a «Explora».</p></noscript>
  </main>

  <nav class="ds-tabbar" aria-label="Navegació principal">
    <a class="ds-tabbar__item" data-tab="index" href="index.html"><i class="fa-solid fa-location-dot" aria-hidden="true"></i><span>A prop</span></a>
    <a class="ds-tabbar__item" data-tab="explora" href="explora.html"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span>Explora</span></a>
    <a class="ds-tabbar__item" data-tab="ruta" href="ruta.html"><i class="fa-solid fa-route" aria-hidden="true"></i><span>Ruta<span class="ds-tabbar__badge" id="voff-route-badge" hidden>0</span></span></a>
    <a class="ds-tabbar__item" data-tab="mapa" href="mapa.html"><i class="fa-solid fa-map" aria-hidden="true"></i><span>Mapa</span></a>
  </nav>

  <script src="assets/vendor/leaflet1.9.3/leaflet.js"></script>
  <script src="js/mapa.js"></script>
</body>
</html>
